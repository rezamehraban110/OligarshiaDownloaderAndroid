name: Build Android APK

on:
  workflow_dispatch:
  create:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore project files
        shell: bash
        run: |
          cat payload/part*.txt | base64 -d > project_payload.tar.gz
          tar -xzf project_payload.tar.gz
          rm -f project_payload.tar.gz

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/Oligarshia-Downloader-v0.1.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Oligarshia-Downloader-v0.1.0-debug
          path: out/Oligarshia-Downloader-v0.1.0-debug.apk
          if-no-files-found: error
          retention-days: 14
